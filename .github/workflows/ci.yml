name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only used by `prisma generate` / config loading; tests start their own database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:54329/wildlen_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Integration tests start a throw-away PostgreSQL (embedded-postgres).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
